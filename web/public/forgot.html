<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020a24">
<title>Forgot PIN · Batlas</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/img/icons/apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Batlas">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="application-name" content="Batlas">
<link rel="stylesheet" href="/css/site.css">
<script type="module" src="/js/common.js"></script>
<script type="module" src="/js/forgot.js"></script>

</head>
<body>
<header id="site-header" class="site-header"></header>
<main id="main">
<div class="auth-box card"><h1>Forgot PIN</h1><p class="muted">Enter your account email and we'll send you a link to choose a new PIN. If you don't have an email, ask a Batlas admin.</p>
<form id="f" novalidate><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
<div id="msg" aria-live="polite"></div><button class="btn primary w100">Send reset link</button></form>
<p class="small muted"><a href="/login">Back to log in</a></p></div>
</main>
<footer id="site-footer" class="site-footer"></footer>
</body>
</html>
