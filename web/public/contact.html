<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020a24">
<title>Contact · Batlas</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/img/icons/apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Batlas">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="application-name" content="Batlas">
<link rel="stylesheet" href="/css/site.css">
<script type="module" src="/js/common.js"></script>
<script type="module" src="/js/contact.js"></script>

</head>
<body>
<header id="site-header" class="site-header"></header>
<main id="main">
<h1>Contact</h1>
<div class="contact-grid">
<form id="f" class="card" novalidate>
  <div class="field"><label for="name">Your name</label><input id="name" name="name" maxlength="80" autocomplete="name" required></div>
  <div class="field"><label for="email">Email <span class="muted small">(optional, only if you want a reply by email)</span></label><input id="email" name="email" type="email" maxlength="254" autocomplete="email"></div>
  <div class="field"><label for="subject">Subject</label><input id="subject" name="subject" maxlength="160" required></div>
  <div class="field"><label for="message">Message</label><textarea id="message" name="message" minlength="10" maxlength="5000" required></textarea></div>
  <div class="hp" aria-hidden="true"><label for="website">Leave this field empty</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div>
  <div id="msg" aria-live="polite"></div>
  <button class="btn primary">Send message</button>
</form>
<div class="card"><h2>Get in touch</h2><p class="muted">Questions about our games, bug reports, press or partnerships, send us a message and the team will get back to you.</p><p class="small muted">Email is optional. If you add one, we only use it to reply to you.</p></div>
</div>
</main>
<footer id="site-footer" class="site-footer"></footer>
</body>
</html>
