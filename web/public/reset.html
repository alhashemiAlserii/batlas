<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111316">
<title>Choose a PIN · Batlas</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/img/icons/apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Batlas">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="application-name" content="Batlas">
<link rel="stylesheet" href="/css/site.css">
<script type="module" src="/js/common.js"></script>
<script type="module" src="/js/reset.js"></script>

</head>
<body>
<header id="site-header" class="site-header"></header>
<main id="main">
<div class="auth-box card"><p class="eyebrow">Batlas account</p><h1>Choose a new PIN</h1>
<form id="f" novalidate><div class="field"><label for="pin">New PIN</label><input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]*" minlength="4" maxlength="6" autocomplete="new-password" required><p class="small muted">4 to 6 digits</p></div>
<div class="field"><label for="pin2">Repeat PIN</label><input id="pin2" name="pin2" type="password" inputmode="numeric" pattern="[0-9]*" minlength="4" maxlength="6" autocomplete="new-password" required></div>
<div id="msg" aria-live="polite"></div><button class="btn primary w100 go">Save PIN</button></form></div>
</main>
<footer id="site-footer" class="site-footer"></footer>
</body>
</html>
