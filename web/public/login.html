<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020a24">
<title>Log in · Batlas</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/favicon-180.png">
<link rel="stylesheet" href="/css/site.css">
<script type="module" src="/js/common.js"></script>
<script type=module src=/js/auth.js></script>
</head>
<body>
<header id="site-header" class="site-header"></header>
<main id="main">
<div class="auth-box card"><h1>Log in</h1>
<form id="f" novalidate><div class="field"><label for="login">Username or email</label><input id="login" name="login" autocomplete="username" required></div>
<div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
<div id="msg" aria-live="polite"></div><button class="btn primary w100">Log in</button></form>
<p class="small muted">New here? <a href="/register">Create an account</a></p></div>
</main>
<footer id="site-footer" class="site-footer"></footer>
</body>
</html>
