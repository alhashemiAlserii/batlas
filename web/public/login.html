<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020a24">
<title>Log in · Batlas</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/img/icons/apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Batlas">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="application-name" content="Batlas">
<link rel="stylesheet" href="/css/site.css">
<script type="module" src="/js/common.js"></script>
<script type=module src=/js/auth.js></script>
</head>
<body>
<header id="site-header" class="site-header"></header>
<main id="main">
<div class="auth-box card"><h1>Log in</h1>
<form id="f" novalidate><div class="field"><label for="login">Handle</label><input id="login" name="login" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required><p class="small muted">The name you sign in with, like Abood. Not case-sensitive.</p></div>
<div class="field"><label for="pin">PIN</label><input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]*" minlength="4" maxlength="6" autocomplete="current-password" required><p class="small muted">4 to 6 digits</p></div>
<div id="msg" aria-live="polite"></div><button class="btn primary w100">Log in</button></form>
<p class="small muted">Forgot your PIN? Ask a Batlas admin to give you a temporary one.</p>
<p class="small muted">Had an account before PINs? <a href="/set-pin">Set a PIN</a> with your current password.</p>
<p class="small muted">New here? <a href="/register">Create an account</a></p></div>
</main>
<footer id="site-footer" class="site-footer"></footer>
</body>
</html>
