<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111316">
<title>Offline · Batlas</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/img/icons/apple-touch-icon-180.png">
<link rel="stylesheet" href="/css/site.css">
<script src="/js/offline.js" defer></script>
</head>
<body>
<main id="main">
<div class="card center-box" data-offline>
  <img class="offline-logo" src="/img/icons/icon-192.png" alt="Batlas" width="96" height="96">
  <h1>You're offline</h1>
  <p class="muted">Batlas needs an internet connection for games, accounts and news. Check your Wi-Fi and try again.</p>
  <button class="btn primary" type="button" id="retry">Try again</button>
  <p class="small muted">This page will reload by itself when you're back online.</p>
</div>
</main>
</body>
</html>
