<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020a24">
<title>Create account · Batlas</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/img/icons/apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Batlas">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="application-name" content="Batlas">
<link rel="stylesheet" href="/css/site.css">
<script type="module" src="/js/common.js"></script>
<script type=module src=/js/auth.js></script>
</head>
<body>
<header id="site-header" class="site-header"></header>
<main id="main">
<div class="auth-box card"><h1>Create account</h1>
<form id="f" novalidate><div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" minlength="3" maxlength="20" required><p class="small muted">3–20 letters, numbers or _</p></div>
<div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="10" required><p class="small muted">At least 10 characters</p></div>
<details class="field optional-email"><summary>Add email (optional)</summary><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email"><p class="small muted">Not required. You can add it later in Settings.</p></div></details>
<div id="msg" aria-live="polite"></div><button class="btn primary w100">Create account</button></form>
<p class="small muted">Already have an account? <a href="/login">Log in</a></p></div>
</main>
<footer id="site-footer" class="site-footer"></footer>
</body>
</html>
