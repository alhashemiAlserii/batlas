<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020a24">
<title>Set a PIN · Batlas</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/img/icons/apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Batlas">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="application-name" content="Batlas">
<link rel="stylesheet" href="/css/site.css">
<script type="module" src="/js/common.js"></script>
<script type="module" src="/js/set-pin.js"></script>
</head>
<body>
<header id="site-header" class="site-header"></header>
<main id="main">
<div class="auth-box card"><h1>Set a PIN</h1>
<p class="muted">Accounts made with a password need a PIN before they can sign in again. This page asks for that password once. After this, you sign in with your handle and PIN only.</p>
<form id="f" novalidate>
<div class="field"><label for="login">Handle</label><input id="login" name="login" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required></div>
<div class="field"><label for="currentPassword">Current password</label><input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required><p class="small muted">The password this account used before PINs. Staff can set a PIN for you instead.</p></div>
<div class="field"><label for="pin">New PIN</label><input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]*" minlength="4" maxlength="6" autocomplete="new-password" required><p class="small muted">4 to 6 digits</p></div>
<div class="field"><label for="pin2">Repeat PIN</label><input id="pin2" name="pin2" type="password" inputmode="numeric" pattern="[0-9]*" minlength="4" maxlength="6" autocomplete="new-password" required></div>
<div id="msg" aria-live="polite"></div><button class="btn primary w100">Save PIN and sign in</button></form>
<p class="small muted"><a href="/login">Back to log in</a></p></div>
</main>
<footer id="site-footer" class="site-footer"></footer>
</body>
</html>
