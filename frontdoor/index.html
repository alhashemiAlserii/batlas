<body class="hold">
<div class="shell">
  <header class="top">
    <img class="mark" src="/__door/img/batlas-mark.png" alt="" width="157" height="120">
    <div>
      <p class="eyebrow">Batlas studio</p>
      <h1>Bring the crew.</h1>
    </div>
  </header>

  <figure class="frame" aria-roledescription="carousel" aria-label="Sky Crew sneak peeks">
    <div class="slides" id="slides"></div>
    <figcaption class="cap">
      <span class="eyebrow">Sneak peek <span class="count" id="count">1 / 8</span></span>
      <span class="line" id="cap">Serve your passengers</span>
    </figcaption>
  </figure>

  <footer class="status">
    <p id="status">Warming up the engines...</p>
    <div class="bar" aria-hidden="true"><i id="bar"></i></div>
    <button id="retry" type="button" hidden>Try again</button>
    <p class="micro">Sky Crew · a co-op flight. This page waits until the studio is awake.</p>
    <p id="live" class="sr-only" role="status" aria-live="polite">Warming up the engines.</p>
  </footer>
</div>
